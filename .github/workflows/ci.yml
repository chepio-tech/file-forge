name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  installer-dpi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test native installer bitmap filtering
        shell: pwsh
        run: |
          # Use the same NSIS version as Tauri bundling; check its published SHA-256 before execution.
          $archive = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          Invoke-WebRequest "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1") {
            throw "NSIS archive checksum mismatch"
          }
          $directory = Join-Path $env:RUNNER_TEMP "nsis-dpi-compiler"
          Expand-Archive $archive -DestinationPath $directory
          # The archive also holds Bin\makensis.exe; Tauri runs the top-level launcher, which starts it.
          $compiler = Join-Path $directory "nsis-3.11\makensis.exe"
          if (!(Test-Path $compiler -PathType Leaf)) { throw "NSIS compiler missing: $compiler" }
          ./.github/scripts/installerDpiTest/installerDpiTest.ps1 -Makensis $compiler
