# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux and commits them to `installers/` on main
# under stable names, so the README links download them directly (ADR-0008).
# Run it manually on main (Actions → release → Run workflow) or push a `v*` tag. See docs/architecture/deployment.md.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `installers`: space-separated `<glob under bundle>=<name in installers/>` pairs. The names are the
        # README's download links; docs/readmeDownloads.test.ts keeps both in sync.
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle: target/aarch64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-AppleSilicon.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: target/x86_64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-Intel.dmg
          - platform: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
            installers: >-
              appimage/*.AppImage=FileForge-Linux-x64.AppImage
              deb/*.deb=FileForge-Linux-x64.deb
              rpm/*.rpm=FileForge-Linux-x64.rpm
          - platform: windows-latest
            args: ""
            bundle: target/release/bundle
            installers: >-
              nsis/*-setup.exe=FileForge-Windows-x64-setup.exe
              msi/*.msi=FileForge-Windows-x64.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build ${{ matrix.args }}

      - name: Collect installers under stable names
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          read -ra entries <<< "$INSTALLERS"
          mkdir -p installers
          for entry in "${entries[@]}"; do
            files=("$BUNDLE"/${entry%%=*})
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $BUNDLE/${entry%%=*}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "installers/${entry#*=}"
          done
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ strategy.job-index }}
          path: installers/
          if-no-files-found: error
          compression-level: 0

  commit-installers:
    # Runs only when every build succeeded, so main never receives a partial set.
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: commit-installers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Remove previous installers
        run: find installers -maxdepth 1 -type f -name 'FileForge-*' -delete

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Commit installers to main
        run: |
          too_large=$(find installers -maxdepth 1 -type f -size +100M)
          if [ -n "$too_large" ]; then
            echo "::error::GitHub rejects files over 100 MiB: $too_large"
            exit 1
          fi
          ls -l installers
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all installers
          if git diff --cached --quiet; then
            echo "Installers are unchanged"
            exit 0
          fi
          git commit -m "[fileforge]: Update installers to v$version"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
