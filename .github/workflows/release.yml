# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux. A pushed `v*` tag publishes them under
# stable names as a GitHub release, so the README's `releases/latest/download/` links download them (ADR-0009).
# A manual run (Actions → release → Run workflow) only builds them as workflow artifacts.
# Updater artifacts are signed with the `TAURI_SIGNING_PRIVATE_KEY*` secrets and listed in the release's `latest.json`,
# which installed apps read to update themselves (ADR-0013). See docs/architecture/deployment.md.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `installers`: space-separated `<glob under bundle>=<release asset name>` pairs. The names are the
        # README's download links; docs/readmeDownloads.test.ts keeps both in sync.
        # `updates`: space-separated `<updater target>=<glob under bundle>=<release asset name>` triples. The target
        # is the key the updater plugin looks up in `latest.json`: `<os>-<arch>-<bundle type>`, so each installed
        # package updates from its own format (docs/updaterManifest.test.ts).
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle: target/aarch64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-AppleSilicon.dmg
            updates: darwin-aarch64-app=macos/*.app.tar.gz=FileForge-macOS-AppleSilicon.app.tar.gz
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: target/x86_64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-Intel.dmg
            updates: darwin-x86_64-app=macos/*.app.tar.gz=FileForge-macOS-Intel.app.tar.gz
          - platform: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
            installers: >-
              appimage/*.AppImage=FileForge-Linux-x64.AppImage
              deb/*.deb=FileForge-Linux-x64.deb
              rpm/*.rpm=FileForge-Linux-x64.rpm
            updates: >-
              linux-x86_64-appimage=appimage/*.AppImage=FileForge-Linux-x64.AppImage
              linux-x86_64-deb=deb/*.deb=FileForge-Linux-x64.deb
              linux-x86_64-rpm=rpm/*.rpm=FileForge-Linux-x64.rpm
          - platform: windows-latest
            args: ""
            bundle: target/release/bundle
            installers: >-
              nsis/*-setup.exe=FileForge-Windows-x64-setup.exe
              msi/*.msi=FileForge-Windows-x64.msi
            updates: >-
              windows-x86_64-nsis=nsis/*-setup.exe=FileForge-Windows-x64-setup.exe
              windows-x86_64-msi=msi/*.msi=FileForge-Windows-x64.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
        env:
          # Tauri otherwise skips Finder layout on CI, which drops the DMG background and icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          # Signs the updater artifacts; installed apps verify them with `plugins.updater.pubkey` (ADR-0013).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers under stable names
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          read -ra entries <<< "$INSTALLERS"
          mkdir -p installers
          for entry in "${entries[@]}"; do
            files=("$BUNDLE"/${entry%%=*})
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $BUNDLE/${entry%%=*}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "installers/${entry#*=}"
          done
          ls -l installers

      - name: Collect updater artifacts and their signatures
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          UPDATES: ${{ matrix.updates }}
        run: |
          shopt -s nullglob
          read -ra entries <<< "$UPDATES"
          mkdir -p installers updates
          for entry in "${entries[@]}"; do
            target=${entry%%=*}
            rest=${entry#*=}
            files=("$BUNDLE"/${rest%%=*})
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}.sig" ]; then
              echo "::error::Expected one signed $BUNDLE/${rest%%=*}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "installers/${rest#*=}"
            cp "${files[0]}.sig" "updates/$target.sig"
            printf '%s\n' "${rest#*=}" > "updates/$target.asset"
          done
          ls -l updates

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ strategy.job-index }}
          path: installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updates-${{ strategy.job-index }}
          path: updates/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    # Runs only when every build succeeded, so a release never has a partial set.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: updates-*
          path: updates
          merge-multiple: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Refuses to publish when installed apps would reject an update (wrong key, bad signature, other version).
      - name: Write the updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/updaterManifest.mjs

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publishRelease.sh
