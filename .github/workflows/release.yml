# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux. A pushed `v*` tag publishes them under
# stable names as a GitHub release, so the README's `releases/latest/download/` links download them (ADR-0009).
# A manual run (Actions → release → Run workflow) only builds them as workflow artifacts.
# See docs/architecture/deployment.md.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `installers`: space-separated `<glob under bundle>=<release asset name>` pairs. The names are the
        # README's download links; docs/readmeDownloads.test.ts keeps both in sync.
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle: target/aarch64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-AppleSilicon.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: target/x86_64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-Intel.dmg
          - platform: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
            installers: >-
              appimage/*.AppImage=FileForge-Linux-x64.AppImage
              deb/*.deb=FileForge-Linux-x64.deb
              rpm/*.rpm=FileForge-Linux-x64.rpm
          - platform: windows-latest
            args: ""
            bundle: target/release/bundle
            installers: >-
              nsis/*-setup.exe=FileForge-Windows-x64-setup.exe
              msi/*.msi=FileForge-Windows-x64.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build ${{ matrix.args }}

      - name: Collect installers under stable names
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          read -ra entries <<< "$INSTALLERS"
          mkdir -p installers
          for entry in "${entries[@]}"; do
            files=("$BUNDLE"/${entry%%=*})
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $BUNDLE/${entry%%=*}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "installers/${entry#*=}"
          done
          ls -l installers

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ strategy.job-index }}
          path: installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    # Runs only when every build succeeded, so a release never has a partial set.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publishRelease.sh
