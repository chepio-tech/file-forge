# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux. A pushed `v*` tag publishes them under
# stable names as a GitHub release, so the README's `releases/latest/download/` links download them (ADR-0009).
# A manual run (Actions → release → Run workflow) only builds them as workflow artifacts.
# See docs/architecture/deployment.md.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `installers`: space-separated `<glob under bundle>=<release asset name>` pairs. The names are the
        # README's download links; docs/readmeDownloads.test.ts keeps both in sync.
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle: target/aarch64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-AppleSilicon.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: target/x86_64-apple-darwin/release/bundle
            installers: dmg/*.dmg=FileForge-macOS-Intel.dmg
          - platform: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
            installers: >-
              appimage/*.AppImage=FileForge-Linux-x64.AppImage
              deb/*.deb=FileForge-Linux-x64.deb
              rpm/*.rpm=FileForge-Linux-x64.rpm
          - platform: windows-latest
            args: ""
            bundle: target/release/bundle
            installers: >-
              nsis/*-setup.exe=FileForge-Windows-x64-setup.exe
              msi/*.msi=FileForge-Windows-x64.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build ${{ matrix.args }}

      - name: Collect installers under stable names
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          shopt -s nullglob
          read -ra entries <<< "$INSTALLERS"
          mkdir -p installers
          for entry in "${entries[@]}"; do
            files=("$BUNDLE"/${entry%%=*})
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $BUNDLE/${entry%%=*}, found ${#files[@]}"
              exit 1
            fi
            cp "${files[0]}" "installers/${entry#*=}"
          done
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ strategy.job-index }}
          path: installers/
          if-no-files-found: error
          compression-level: 0

  publish-release:
    # Runs only when every build succeeded, so a release never has a partial set.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          ls -l installers
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --verify-tag --title "FileForge $TAG" \
              --notes "Installers for macOS, Windows and Linux. Builds are not signed or notarized yet; see the README for first-launch steps."
          fi
