[workspace]
resolver = "3"
members = ["crates/fileforge-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Denys Chepiha"]

[workspace.dependencies]
fileforge-core = { path = "crates/fileforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Image codecs are unusably slow without optimizations, even in tests and `tauri dev`.
[profile.dev.package."*"]
opt-level = 2

# Size-oriented release profile, see https://tauri.app/concept/size/#cargo-configuration
# `panic` stays "unwind" (not the template's "abort"): a parser panic on a malformed input file must become an
# error for that file, not a crash of the whole app. See docs/decisions/ADR-0004-untrusted-file-isolation.md.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
